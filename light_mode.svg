<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');

            .title { font: 700 22px 'Inter', sans-serif; fill: #0F172A; }
            .subtitle { font: 500 13px 'Inter', sans-serif; fill: #64748B; }
            .handle { font: 600 13px 'Inter', sans-serif; fill: #4F46E5; }
            .label { font: 600 11px 'Inter', sans-serif; fill: #64748B; text-transform: uppercase; letter-spacing: 0.8px; }
            .body { font: 400 13px 'Inter', sans-serif; fill: #334155; }
            .day-label { font: 500 10px 'Inter', sans-serif; fill: #64748B; text-anchor: middle; }
            
            .val-num { font: 700 28px 'JetBrains Mono', monospace; fill: #0F172A; }
            .val-accent { font: 700 28px 'JetBrains Mono', monospace; fill: #4F46E5; }
            .val-green { font: 700 28px 'JetBrains Mono', monospace; fill: #059669; }
            .val-purple { font: 700 28px 'JetBrains Mono', monospace; fill: #4F46E5; }

            .chip { fill: #F1F5F9; stroke: #E2E8F0; stroke-width: 1; }
            .chip-accent { fill: #EEF2FF; stroke: #C7D2FE; stroke-width: 1; }
            .chip-text { font: 500 11px 'Inter', sans-serif; fill: #334155; }
            .chip-accent-text { font: 600 11px 'Inter', sans-serif; fill: #3730A3; }

            .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
            .bar { fill: #4F46E5; rx: 4; }
            .bar-active { fill: #059669; rx: 4; }

            .add { font: 700 13px 'JetBrains Mono', monospace; fill: #059669; }
            .del { font: 700 13px 'JetBrains Mono', monospace; fill: #DC2626; }
            .mono { font: 600 13px 'JetBrains Mono', monospace; fill: #0F172A; }
        </style>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="520" rx="16" fill="#F8FAFC"/>
    <rect x="1" y="1" width="958" height="518" rx="15" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- ================= HEADER SECTION ================= -->
    <g transform="translate(24, 20)">
        <rect width="912" height="96" rx="12" class="card"/>
        
        <!-- Avatar Circle -->
        <circle cx="52" cy="48" r="26" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
        <text x="40" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#4F46E5">AM</text>

        <!-- User Information -->
        <text x="94" y="42" class="title">Ayub Mahmood</text>
        <text x="264" y="40" class="handle">@roodyridar2</text>
        <text x="94" y="64" class="subtitle">Software Engineer @ Otee • Erbil, Kurdistan</text>
    </g>

    <!-- ================= METRICS GRID (4 COLUMNS) ================= -->
    <!-- 1. Repositories -->
    <g transform="translate(24, 130)">
        <rect width="216" height="88" rx="12" class="card"/>
        <text x="20" y="30" class="label">Repositories</text>
        <text x="20" y="66" id="repo_data" class="val-num">68</text>
    </g>

    <!-- 2. Contributions -->
    <g transform="translate(256, 130)">
        <rect width="216" height="88" rx="12" class="card"/>
        <text x="20" y="30" class="label">Contributions</text>
        <text x="20" y="66" id="contrib_data" class="val-accent">3,551</text>
    </g>

    <!-- 3. Current Streak -->
    <g transform="translate(488, 130)">
        <rect width="216" height="88" rx="12" class="card"/>
        <text x="20" y="30" class="label">Current Streak</text>
        <text x="20" y="66" id="streak_data" class="val-green">8</text>
        <text x="70" y="64" class="body" font-size="12">days ⚡</text>
    </g>

    <!-- 4. Regional Rank -->
    <g transform="translate(720, 130)">
        <rect width="216" height="88" rx="12" class="card"/>
        <text x="20" y="30" class="label">Regional Rank</text>
        <text x="20" y="66" id="rank_data" class="val-purple">#30</text>
        <text x="90" y="64" class="body" font-size="12">Kurdistan</text>
    </g>

    <!-- ================= MIDDLE SECTION (STACK & GRAPH) ================= -->
    
    <!-- LEFT: Tech Stack Section -->
    <g transform="translate(24, 232)">
        <rect width="448" height="180" rx="12" class="card"/>
        
        <text x="20" y="30" class="label">Tech Stack &amp; Core Skills</text>

        <!-- Category 1: Frontend & Mobile -->
        <g transform="translate(20, 44)">
            <text x="0" y="14" class="subtitle" font-size="11" font-weight="600">Frontend &amp; Mobile</text>
            <rect y="22" width="56" height="24" rx="6" class="chip-accent"/>
            <text x="10" y="38" class="chip-accent-text">Flutter</text>

            <rect x="62" y="22" width="50" height="24" rx="6" class="chip"/>
            <text x="72" y="38" class="chip-text">React</text>

            <rect x="118" y="22" width="76" height="24" rx="6" class="chip"/>
            <text x="128" y="38" class="chip-text">TypeScript</text>

            <rect x="200" y="22" width="56" height="24" rx="6" class="chip"/>
            <text x="210" y="38" class="chip-text">Next.js</text>
        </g>

        <!-- Category 2: Backend & Database -->
        <g transform="translate(20, 108)">
            <text x="0" y="14" class="subtitle" font-size="11" font-weight="600">Backend &amp; Database</text>
            <rect y="22" width="58" height="24" rx="6" class="chip"/>
            <text x="10" y="38" class="chip-text">Node.js</text>

            <rect x="64" y="22" width="52" height="24" rx="6" class="chip"/>
            <text x="74" y="38" class="chip-text">Docker</text>

            <rect x="122" y="22" width="74" height="24" rx="6" class="chip"/>
            <text x="132" y="38" class="chip-text">PostgreSQL</text>

            <rect x="202" y="22" width="52" height="24" rx="6" class="chip"/>
            <text x="212" y="38" class="chip-text">Python</text>

            <rect x="260" y="22" width="40" height="24" rx="6" class="chip"/>
            <text x="270" y="38" class="chip-text">SQL</text>
        </g>
    </g>

    <!-- RIGHT: Activity Graph Bar Chart -->
    <g transform="translate(488, 232)">
        <rect width="448" height="180" rx="12" class="card"/>
        
        <text x="20" y="30" class="label">Weekly Activity Graph</text>

        <!-- Dynamic Activity Bars Container -->
        <g transform="translate(24, 36)">
            <!-- Grid Lines -->
            <line x1="0" y1="35" x2="400" y2="35" stroke="#E2E8F0" stroke-dasharray="4,4"/>
            <line x1="0" y1="70" x2="400" y2="70" stroke="#E2E8F0" stroke-dasharray="4,4"/>
            <line x1="0" y1="105" x2="400" y2="105" stroke="#CBD5E1"/>

            <!-- Bar 0 (Mon) -->
            <path id="bar_0" d="M 20,105 L 20,76 Q 20,71 25,71 L 43,71 Q 48,71 48,76 L 48,105 Z" class="bar"/>
            <text x="34" y="120" class="day-label">Mon</text>

            <!-- Bar 1 (Tue) -->
            <path id="bar_1" d="M 75,105 L 75,70 Q 75,65 80,65 L 98,65 Q 103,65 103,70 L 103,105 Z" class="bar"/>
            <text x="89" y="120" class="day-label">Tue</text>

            <!-- Bar 2 (Wed) -->
            <path id="bar_2" d="M 130,105 L 130,99 Q 130,94 135,94 L 153,94 Q 158,94 158,99 L 158,105 Z" class="bar-active"/>
            <text x="144" y="120" class="day-label">Wed</text>

            <!-- Bar 3 (Thu) -->
            <path id="bar_3" d="M 185,105 L 185,96 Q 185,91 190,91 L 208,91 Q 213,91 213,96 L 213,105 Z" class="bar"/>
            <text x="199" y="120" class="day-label">Thu</text>

            <!-- Bar 4 (Fri) -->
            <path id="bar_4" d="M 240,105 L 240,35 Q 240,30 245,30 L 263,30 Q 268,30 268,35 L 268,105 Z" class="bar"/>
            <text x="254" y="120" class="day-label">Fri</text>

            <!-- Bar 5 (Sat) -->
            <path id="bar_5" d="M 295,105 L 295,38 Q 295,33 300,33 L 318,33 Q 323,33 323,38 L 323,105 Z" class="bar"/>
            <text x="309" y="120" class="day-label">Sat</text>

            <!-- Bar 6 (Sun) -->
            <path id="bar_6" d="M 350,105 L 350,104 Q 350,99 355,99 L 373,99 Q 378,99 378,104 L 378,105 Z" class="bar"/>
            <text x="364" y="120" class="day-label">Sun</text>
        </g>
    </g>

    <!-- ================= BOTTOM OVERVIEW BAR ================= -->
    <g transform="translate(24, 424)">
        <rect width="912" height="76" rx="12" class="card"/>
        
        <!-- Lines of Code & Links -->
        <g transform="translate(20, 24)">
            <text x="0" y="14" class="label">Lines of Code</text>
            <text x="110" y="15" id="loc_data" class="mono">6,979,206</text>

            <text x="200" y="15" id="loc_add" class="add">++ 7,940,528</text>
            <text x="300" y="15" id="loc_del" class="del">-- 961,322</text>
        </g>

        <g transform="translate(20, 50)">
            <text x="0" y="14" class="subtitle">Total Commits:</text>
            <text x="105" y="14" id="commit_data" class="mono">3,503</text>

            <text x="250" y="14" class="subtitle">Followers:</text>
            <text x="320" y="14" id="follower_data" class="mono">10</text>

            <text x="400" y="14" class="subtitle">Portfolio:</text>
            <text x="470" y="14" class="mono" fill="#4F46E5">https://ayub.is-a.dev/</text>
        </g>
    </g>

    <!-- Hidden elements for today.py compatibility -->
    <text id="age_data" display="none">23 years, 6 months, 20 days</text>
    <text id="age_data_dots" display="none"> . </text>
    <text id="commit_data_dots" display="none"> . </text>
    <text id="rank_data_dots" display="none"> . </text>
    <text id="repo_data_dots" display="none"> . </text>
    <text id="follower_data_dots" display="none"> . </text>
    <text id="loc_data_dots" display="none"> . </text>
    <text id="streak_data_dots" display="none"> . </text>
</svg>