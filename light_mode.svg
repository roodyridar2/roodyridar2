<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');

            * { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }

            .c-bg { fill: #EFF1F5; }
            .c-txt-main { fill: #4C4F69; }
            .c-txt-sub { fill: #5C5F77; }
            .c-txt-muted { fill: #9CA0B0; }
            .c-txt-mauve { fill: #8839EF; }
            .c-txt-blue { fill: #1E66F5; }
            .c-txt-green { fill: #40A02B; }
            .c-txt-peach { fill: #FE640B; }
            .c-txt-red { fill: #D20F39; }
            .c-txt-yellow { fill: #DF8E1D; }
            .c-txt-teal { fill: #179299; }

            .val-num { font: 700 24px 'JetBrains Mono', monospace; fill: #4C4F69; }
            .val-accent { font: 700 24px 'JetBrains Mono', monospace; fill: #1E66F5; }
            .val-green { font: 700 24px 'JetBrains Mono', monospace; fill: #40A02B; }
            .val-purple { font: 700 24px 'JetBrains Mono', monospace; fill: #8839EF; }

            .label { font: 700 10px 'JetBrains Mono', monospace; fill: #9CA0B0; letter-spacing: 0.6px; }
            .body { font: 500 12px 'JetBrains Mono', monospace; fill: #5C5F77; }
            .day-label { font: 600 10px 'JetBrains Mono', monospace; fill: #9CA0B0; text-anchor: middle; }

            .bar { fill: #1E66F5; rx: 4; }
            .bar-active { fill: #40A02B; rx: 4; }

            .add { font: 700 12px 'JetBrains Mono', monospace; fill: #40A02B; }
            .del { font: 700 12px 'JetBrains Mono', monospace; fill: #D20F39; }
            .mono { font: 600 12px 'JetBrains Mono', monospace; fill: #4C4F69; }
        </style>

        <linearGradient id="hyprBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8839EF"/>
            <stop offset="100%" stop-color="#1E66F5"/>
        </linearGradient>
        
        <linearGradient id="archGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E66F5"/>
            <stop offset="100%" stop-color="#8839EF"/>
        </linearGradient>

        <clipPath id="leftWindowClipLight">
            <rect width="459" height="468" rx="10"/>
        </clipPath>
        <clipPath id="rightTopClipLight">
            <rect width="459" height="227" rx="10"/>
        </clipPath>
        <clipPath id="rightBottomClipLight">
            <rect width="459" height="227" rx="10"/>
        </clipPath>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="540" rx="16" class="c-bg"/>
    <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#CCD0DA" stroke-width="1.5"/>

    <!-- ================= TOP STATUS BAR (WAYBAR) ================= -->
    <!-- Left Module: Workspaces -->
    <g transform="translate(14, 14)">
        <rect width="240" height="30" rx="6" fill="#E6E9EF" stroke="#CCD0DA" stroke-width="1"/>
        <rect x="4" y="4" width="52" height="22" rx="4" fill="#8839EF"/>
        <text x="30" y="19" font-size="11" font-weight="700" fill="#EFF1F5" text-anchor="middle">1:dev</text>
        <text x="84" y="19" font-size="11" font-weight="600" class="c-txt-muted" text-anchor="middle">2:term</text>
        <text x="136" y="19" font-size="11" font-weight="600" class="c-txt-muted" text-anchor="middle">3:git</text>
        <text x="188" y="19" font-size="11" font-weight="600" class="c-txt-muted" text-anchor="middle">4:sys</text>
    </g>

    <!-- Center Module: Host & Distro -->
    <g transform="translate(268, 14)">
        <rect width="396" height="30" rx="6" fill="#E6E9EF" stroke="#CCD0DA" stroke-width="1"/>
        <text x="198" y="19" font-size="11" font-weight="600" class="c-txt-main" text-anchor="middle">
            <tspan fill="#1E66F5">λ</tspan> archlinux <tspan fill="#9CA0B0">•</tspan> roody@arch:~ <tspan fill="#8839EF">(hyprland)</tspan>
        </text>
    </g>

    <!-- Right Module: Rank & System Pill -->
    <g transform="translate(678, 14)">
        <rect width="268" height="30" rx="6" fill="#E6E9EF" stroke="#CCD0DA" stroke-width="1"/>
        <text x="16" y="19" font-size="11" font-weight="700" fill="#DF8E1D">★ #26 Kurdistan</text>
        <text x="142" y="19" font-size="11" font-weight="600" class="c-txt-muted">|</text>
        <text x="158" y="19" font-size="11" font-weight="700" fill="#40A02B">⚡ 8d</text>
        <circle cx="218" cy="15" r="4" fill="#40A02B"/>
        <text x="228" y="19" font-size="11" font-weight="600" fill="#40A02B">idle</text>
    </g>

    <!-- ================= MAIN DESKTOP AREA ================= -->

    <!-- LEFT WINDOW: TERMINAL (fastfetch & stack.json) -->
    <g transform="translate(14, 58)">
        <!-- Background Fill -->
        <rect width="459" height="468" rx="10" fill="#FFFFFF"/>

        <!-- Content Clipped to Rounded Rectangle -->
        <g clip-path="url(#leftWindowClipLight)">
            <!-- Window Titlebar -->
            <rect width="459" height="30" fill="#E6E9EF"/>
            <line x1="0" y1="30" x2="459" y2="30" stroke="#CCD0DA" stroke-width="1"/>
            
            <!-- Controls -->
            <circle cx="16" cy="15" r="4.5" fill="#D20F39"/>
            <circle cx="30" cy="15" r="4.5" fill="#DF8E1D"/>
            <circle cx="44" cy="15" r="4.5" fill="#40A02B"/>
            <text x="60" y="19" font-size="11" font-weight="600" class="c-txt-sub">kitty ~ roody@arch: ~/profile</text>
            <rect x="397" y="6" width="50" height="18" rx="3" fill="rgba(64, 160, 43, 0.15)"/>
            <text x="422" y="19" font-size="9" font-weight="700" fill="#40A02B" text-anchor="middle">active</text>

            <!-- Command 1: fastfetch -->
            <text x="16" y="54" font-size="12" font-weight="700" fill="#4C4F69">
                <tspan fill="#40A02B">roody@arch</tspan><tspan fill="#9CA0B0">:</tspan><tspan fill="#1E66F5">~</tspan><tspan fill="#8839EF">$</tspan> fastfetch
            </text>

            <!-- Vector Arch Logo -->
            <g transform="translate(16, 70)">
                <path d="M 40,8 L 10,76 C 21,70 30,66 40,66 C 35,55 33,43 35,33 C 38,41 42,50 49,58 C 55,57 61,58 69,61 L 40,8 Z M 40,72 C 34,72 26,75 16,79 C 27,82 36,84 44,84 C 51,84 58,82 67,78 C 58,74 49,72 40,72 Z" fill="url(#archGradLight)"/>
            </g>

            <!-- Fastfetch Info Lines -->
            <g transform="translate(112, 74)">
                <text x="0" y="12" font-size="13" font-weight="700" fill="#8839EF">roody@archlinux</text>
                <line x1="0" y1="19" x2="326" y2="19" stroke="#CCD0DA" stroke-width="1"/>

                <text x="0" y="36" font-size="11" font-weight="600" class="c-txt-peach">user     <tspan class="c-txt-main" font-weight="500">Ayub Mahmood</tspan></text>
                <text x="0" y="54" font-size="11" font-weight="600" class="c-txt-yellow">role     <tspan class="c-txt-main" font-weight="500">Software Engineer @ Otee</tspan></text>
                <text x="0" y="72" font-size="11" font-weight="600" class="c-txt-teal">loc      <tspan class="c-txt-main" font-weight="500">Erbil, Kurdistan</tspan></text>
                <text x="0" y="90" font-size="11" font-weight="600" class="c-txt-blue">wm       <tspan class="c-txt-main" font-weight="500">Hyprland (Wayland)</tspan></text>
                <text x="0" y="108" font-size="11" font-weight="600" class="c-txt-mauve">shell    <tspan class="c-txt-main" font-weight="500">zsh 5.9 (kitty)</tspan></text>
                <text x="0" y="126" font-size="11" font-weight="600" class="c-txt-green">uptime   <tspan id="age_data" class="c-txt-green" font-weight="600">23 years, 7 months, 22 days</tspan></text>

                <!-- Color Palette Row -->
                <g transform="translate(0, 138)">
                    <rect x="0" width="18" height="9" rx="2" fill="#D20F39"/>
                    <rect x="22" width="18" height="9" rx="2" fill="#FE640B"/>
                    <rect x="44" width="18" height="9" rx="2" fill="#DF8E1D"/>
                    <rect x="66" width="18" height="9" rx="2" fill="#40A02B"/>
                    <rect x="88" width="18" height="9" rx="2" fill="#179299"/>
                    <rect x="110" width="18" height="9" rx="2" fill="#1E66F5"/>
                    <rect x="132" width="18" height="9" rx="2" fill="#8839EF"/>
                    <rect x="154" width="18" height="9" rx="2" fill="#4C4F69"/>
                </g>
            </g>

            <!-- Command 2: cat ~/.config/skills.json -->
            <line x1="16" y1="238" x2="443" y2="238" stroke="#CCD0DA" stroke-dasharray="3,3"/>
            <text x="16" y="258" font-size="12" font-weight="700" fill="#4C4F69">
                <tspan fill="#40A02B">roody@arch</tspan><tspan fill="#9CA0B0">:</tspan><tspan fill="#1E66F5">~</tspan><tspan fill="#8839EF">$</tspan> cat ~/.config/stack.json
            </text>

            <!-- JSON Code Preview Card -->
            <g transform="translate(16, 270)">
                <rect width="427" height="154" rx="6" fill="#EFF1F5" stroke="#CCD0DA" stroke-width="1"/>
                <text x="16" y="24" font-size="11" class="c-txt-muted">{</text>
                
                <text x="28" y="44" font-size="11" class="c-txt-blue">"frontend"<tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-green">"Flutter"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"React"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"TypeScript"</tspan><tspan class="c-txt-muted">],</tspan></text>
                
                <text x="28" y="66" font-size="11" class="c-txt-blue">"backend" <tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-green">"Node.js"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"Docker"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"PostgreSQL"</tspan><tspan class="c-txt-muted">],</tspan></text>
                
                <text x="28" y="88" font-size="11" class="c-txt-blue">"languages"<tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-green">"Python"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"Dart"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"SQL"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"Bash"</tspan><tspan class="c-txt-muted">],</tspan></text>
                
                <text x="28" y="110" font-size="11" class="c-txt-blue">"ricing"   <tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-peach">"Hyprland"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-peach">"Waybar"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-peach">"Catppuccin"</tspan><tspan class="c-txt-muted">]</tspan></text>
                
                <text x="16" y="132" font-size="11" class="c-txt-muted">}</text>
            </g>

            <!-- Neovim Style Statusline -->
            <g transform="translate(0, 440)">
                <rect width="459" height="28" fill="#E6E9EF"/>
                <line x1="0" y1="0" x2="459" y2="0" stroke="#CCD0DA" stroke-width="1"/>
                <rect x="8" y="5" width="62" height="18" rx="3" fill="#8839EF"/>
                <text x="39" y="18" font-size="9" font-weight="800" fill="#EFF1F5" text-anchor="middle">NORMAL</text>
                <text x="80" y="18" font-size="10" font-weight="600" class="c-txt-main">stack.json</text>
                <text x="380" y="18" font-size="10" font-weight="600" class="c-txt-muted">utf-8 | 100%</text>
            </g>
        </g>

        <!-- Active Hyprland Border (Drawn ON TOP of all content for 100% uniform thickness on all 4 sides) -->
        <rect x="1" y="1" width="457" height="466" rx="9" fill="none" stroke="url(#hyprBorderLight)" stroke-width="2"/>
    </g>

    <!-- ================= RIGHT COLUMN ================= -->

    <!-- TOP RIGHT: GIT STATS RADAR -->
    <g transform="translate(487, 58)">
        <rect width="459" height="227" rx="10" fill="#FFFFFF"/>

        <g clip-path="url(#rightTopClipLight)">
            <!-- Header / Titlebar -->
            <rect width="459" height="30" fill="#E6E9EF"/>
            <line x1="0" y1="30" x2="459" y2="30" stroke="#CCD0DA" stroke-width="1"/>
            <circle cx="16" cy="15" r="4.5" fill="#D20F39"/>
            <circle cx="30" cy="15" r="4.5" fill="#DF8E1D"/>
            <circle cx="44" cy="15" r="4.5" fill="#40A02B"/>
            <text x="60" y="19" font-size="11" font-weight="600" class="c-txt-sub">git-radar ~ metrics</text>
            <rect x="397" y="6" width="50" height="18" rx="3" fill="rgba(30, 102, 245, 0.15)"/>
            <text x="422" y="19" font-size="9" font-weight="700" fill="#1E66F5" text-anchor="middle">master</text>

            <!-- 2x2 Metric Grid -->
            <!-- Card 1: Streak -->
            <g transform="translate(14, 40)">
                <rect width="209" height="83" rx="6" fill="#EFF1F5" stroke="#CCD0DA" stroke-width="1"/>
                <text x="20" y="24" class="label">CURRENT STREAK</text>
                <text x="20" y="62" id="streak_data" class="val-green">8</text>
                <text x="45" y="60" id="streak_unit" class="body">days ⚡</text>
            </g>

            <!-- Card 2: Rank -->
            <g transform="translate(236, 40)">
                <rect width="209" height="83" rx="6" fill="#EFF1F5" stroke="#CCD0DA" stroke-width="1"/>
                <text x="20" y="24" class="label">REGIONAL RANK</text>
                <text x="20" y="62" id="rank_data" class="val-purple">#26</text>
                <text x="80" y="60" class="body">Kurdistan</text>
            </g>

            <!-- Card 3: Repositories -->
            <g transform="translate(14, 133)">
                <rect width="209" height="83" rx="6" fill="#EFF1F5" stroke="#CCD0DA" stroke-width="1"/>
                <text x="20" y="24" class="label">REPOSITORIES</text>
                <text x="20" y="62" id="repo_data" class="val-num">73</text>
                <text x="75" y="60" class="body">public</text>
            </g>

            <!-- Card 4: Contributions -->
            <g transform="translate(236, 133)">
                <rect width="209" height="83" rx="6" fill="#EFF1F5" stroke="#CCD0DA" stroke-width="1"/>
                <text x="20" y="24" class="label">CONTRIBUTIONS</text>
                <text x="20" y="62" id="contrib_data" class="val-accent">3,674</text>
                <text x="115" y="60" class="body">total</text>
            </g>
        </g>

        <!-- Clean Window Border on top -->
        <rect x="0.75" y="0.75" width="457.5" height="225.5" rx="9.5" fill="none" stroke="#CCD0DA" stroke-width="1.5"/>
    </g>

    <!-- BOTTOM RIGHT: ACTIVITY GRAPH & LOC (btop style) -->
    <g transform="translate(487, 299)">
        <rect width="459" height="227" rx="10" fill="#FFFFFF"/>

        <g clip-path="url(#rightBottomClipLight)">
            <!-- Header / Titlebar -->
            <rect width="459" height="30" fill="#E6E9EF"/>
            <line x1="0" y1="30" x2="459" y2="30" stroke="#CCD0DA" stroke-width="1"/>
            <circle cx="16" cy="15" r="4.5" fill="#D20F39"/>
            <circle cx="30" cy="15" r="4.5" fill="#DF8E1D"/>
            <circle cx="44" cy="15" r="4.5" fill="#40A02B"/>
            <text x="60" y="19" font-size="11" font-weight="600" class="c-txt-sub">btop v1.3.2 ~ git activity</text>
            <rect x="397" y="6" width="50" height="18" rx="3" fill="rgba(64, 160, 43, 0.15)"/>
            <text x="422" y="19" font-size="9" font-weight="700" fill="#40A02B" text-anchor="middle">running</text>

            <!-- Dynamic Activity Bars Container -->
            <g transform="translate(33, 20)">
                <!-- Grid Lines -->
                <line x1="0" y1="35" x2="400" y2="35" stroke="#CCD0DA" stroke-dasharray="4,4"/>
                <line x1="0" y1="70" x2="400" y2="70" stroke="#CCD0DA" stroke-dasharray="4,4"/>
                <line x1="0" y1="105" x2="400" y2="105" stroke="#CCD0DA"/>

                <!-- Bar 0 (Mon) -->
                <path id="bar_0" d="M 20,105 L 20,35 Q 20,30 25,30 L 43,30 Q 48,30 48,35 L 48,105 Z" class="bar"/>
                <text x="34" y="120" class="day-label">Mon</text>

                <!-- Bar 1 (Tue) -->
                <path id="bar_1" d="M 75,105 L 75,104 Q 75,99 80,99 L 98,99 Q 103,99 103,104 L 103,105 Z" class="bar"/>
                <text x="89" y="120" class="day-label">Tue</text>

                <!-- Bar 2 (Wed) -->
                <path id="bar_2" d="M 130,105 L 130,104 Q 130,99 135,99 L 153,99 Q 158,99 158,104 L 158,105 Z" class="bar-active"/>
                <text x="144" y="120" class="day-label">Wed</text>

                <!-- Bar 3 (Thu) -->
                <path id="bar_3" d="M 185,105 L 185,104 Q 185,99 190,99 L 208,99 Q 213,99 213,104 L 213,105 Z" class="bar"/>
                <text x="199" y="120" class="day-label">Thu</text>

                <!-- Bar 4 (Fri) -->
                <path id="bar_4" d="M 240,105 L 240,90 Q 240,85 245,85 L 263,85 Q 268,85 268,90 L 268,105 Z" class="bar"/>
                <text x="254" y="120" class="day-label">Fri</text>

                <!-- Bar 5 (Sat) -->
                <path id="bar_5" d="M 295,105 L 295,104 Q 295,99 300,99 L 318,99 Q 323,99 323,104 L 323,105 Z" class="bar"/>
                <text x="309" y="120" class="day-label">Sat</text>

                <!-- Bar 6 (Sun) -->
                <path id="bar_6" d="M 350,105 L 350,104 Q 350,99 355,99 L 373,99 Q 378,99 378,104 L 378,105 Z" class="bar"/>
                <text x="364" y="120" class="day-label">Sun</text>
            </g>

            <!-- Divider & Terminal Metrics Footer -->
            <line x1="14" y1="158" x2="445" y2="158" stroke="#CCD0DA" stroke-width="1"/>

            <g transform="translate(14, 168)">
                <text x="0" y="14" font-size="11" class="c-txt-muted">
                    Lines of Code: <tspan id="loc_data" class="mono">7,543,886</tspan>  <tspan id="loc_add" class="add">++ 8,684,111</tspan>  <tspan id="loc_del" class="del">-- 1,140,225</tspan>
                </text>
                <text x="0" y="38" font-size="11" class="c-txt-muted">
                    Commits: <tspan id="commit_data" class="mono">3,624</tspan>  •  Followers: <tspan id="follower_data" class="mono">10</tspan>  •  <tspan fill="#1E66F5">ayub.is-a.dev</tspan>
                </text>
            </g>
        </g>

        <!-- Clean Window Border on top -->
        <rect x="0.75" y="0.75" width="457.5" height="225.5" rx="9.5" fill="none" stroke="#CCD0DA" stroke-width="1.5"/>
    </g>

    <!-- Hidden compatibility elements for today.py -->
    <text id="age_data_dots" display="none"> . </text>
    <text id="commit_data_dots" display="none"> . </text>
    <text id="rank_data_dots" display="none"> . </text>
    <text id="repo_data_dots" display="none"> . </text>
    <text id="follower_data_dots" display="none"> . </text>
    <text id="loc_data_dots" display="none"> . </text>
    <text id="streak_data_dots" display="none"> . </text>
</svg>