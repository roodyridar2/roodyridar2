<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');

            * { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

            .t { fill: #2E3047; }
            .s { fill: #4C4F69; }
            .m { fill: #6C6F85; }
            .f { fill: #8C8FA1; }
            .mv { fill: #7C3AED; }
            .bl { fill: #1D5FE0; }
            .gr { fill: #2F8A1F; }
            .rd { fill: #C8102E; }

            .name { font-size: 24px; font-weight: 800; fill: #2E3047; }
            .tagline { font-size: 13px; font-weight: 500; fill: #4C4F69; }
            .lbl { font-size: 11px; font-weight: 700; fill: #6C6F85; letter-spacing: 0.6px; }
            .big { font-size: 34px; font-weight: 800; }
            .unit { font-size: 14px; font-weight: 500; fill: #4C4F69; }
            .num { font-size: 18px; font-weight: 800; fill: #2E3047; }
            .day { font-size: 12px; font-weight: 600; fill: #6C6F85; text-anchor: middle; }
            .chip { font-size: 12px; font-weight: 600; fill: #4C4F69; text-anchor: middle; }

            .bar { fill: url(#barGrad); }
            .bar-active { fill: #2F8A1F; }
        </style>

        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F3F0FA"/>
            <stop offset="100%" stop-color="#E9F0FB"/>
        </linearGradient>
        <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1D5FE0"/>
            <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
        <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED"/>
            <stop offset="100%" stop-color="#1D5FE0"/>
        </linearGradient>
        <filter id="softShadow" x="-5%" y="-10%" width="110%" height="130%">
            <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#3B3F6B" flood-opacity="0.09"/>
        </filter>
    </defs>

    <!-- Canvas -->
    <rect width="960" height="480" rx="16" fill="url(#bgGrad)"/>
    <rect x="0.75" y="0.75" width="958.5" height="478.5" rx="15.25" fill="none" stroke="#DCE0EA" stroke-width="1.5"/>

    <!-- Header -->
    <g transform="translate(16, 16)">
        <rect width="928" height="96" rx="12" fill="#FFFFFF" stroke="#E1E4ED" filter="url(#softShadow)"/>
        <g transform="translate(20, 12) scale(0.85)">
            <path d="M 40,8 L 10,76 C 21,70 30,66 40,66 C 35,55 33,43 35,33 C 38,41 42,50 49,58 C 55,57 61,58 69,61 L 40,8 Z M 40,72 C 34,72 26,75 16,79 C 27,82 36,84 44,84 C 51,84 58,82 67,78 C 58,74 49,72 40,72 Z" fill="url(#archGrad)"/>
        </g>
        <text x="100" y="46" class="name">Ayub Mahmood</text>
        <text x="100" y="72" class="tagline">Software Engineer @ Otee <tspan class="f">·</tspan> Erbil, Kurdistan <tspan class="f">·</tspan> Arch + Hyprland</text>
        <text x="904" y="46" font-size="14" font-weight="700" class="bl" text-anchor="end">ayub.is-a.dev</text>
        <text x="904" y="72" font-size="12" font-weight="600" class="m" text-anchor="end">uptime <tspan id="age_data" class="gr">23 years, 9 months, 14 days</tspan></text>
    </g>

    <!-- Stat tiles -->
    <g transform="translate(16, 128)">
        <g>
            <rect width="223" height="110" rx="12" fill="#EFF8EC" stroke="#CFE8C8"/>
            <text x="22" y="32" class="lbl">CURRENT STREAK</text>
            <text x="22" y="82"><tspan id="streak_data" class="big gr">4</tspan><tspan id="streak_unit" dx="10" class="unit">days</tspan></text>
        </g>
        <g transform="translate(235, 0)">
            <rect width="223" height="110" rx="12" fill="#F4EEFE" stroke="#E0D2FB"/>
            <text x="22" y="32" class="lbl">REGIONAL RANK</text>
            <text x="22" y="82"><tspan id="rank_data" class="big mv">#41</tspan><tspan dx="10" class="unit">Kurdistan</tspan></text>
        </g>
        <g transform="translate(470, 0)">
            <rect width="223" height="110" rx="12" fill="#EDF3FE" stroke="#D2E0FB"/>
            <text x="22" y="32" class="lbl">CONTRIBUTIONS · PAST YEAR</text>
            <text x="22" y="82"><tspan id="contrib_data" class="big bl">4,054</tspan></text>
        </g>
        <g transform="translate(705, 0)">
            <rect width="223" height="110" rx="12" fill="#FFFFFF" stroke="#E1E4ED"/>
            <text x="22" y="32" class="lbl">REPOSITORIES</text>
            <text x="22" y="82"><tspan id="repo_data" class="big t">86</tspan><tspan dx="10" class="unit">owned</tspan></text>
        </g>
    </g>

    <!-- Activity -->
    <g transform="translate(16, 254)">
        <rect width="560" height="210" rx="12" fill="#FFFFFF" stroke="#E1E4ED" filter="url(#softShadow)"/>
        <text x="22" y="32" class="lbl">ACTIVITY · LAST 7 DAYS</text>
        <g transform="translate(24, 44)">
            <line x1="0" y1="20" x2="512" y2="20" stroke="#E1E4ED" stroke-dasharray="4,4"/>
            <line x1="0" y1="70" x2="512" y2="70" stroke="#E1E4ED" stroke-dasharray="4,4"/>
            <line x1="0" y1="120" x2="512" y2="120" stroke="#DCE0EA"/>
            <path id="bar_0" d="M 28,120 L 28,117 Q 28,112 33,112 L 63,112 Q 68,112 68,117 L 68,120 Z" class="bar"/>
            <text id="day_0" x="48" y="142" class="day">Thu</text>
            <path id="bar_1" d="M 100,120 L 100,117 Q 100,112 105,112 L 135,112 Q 140,112 140,117 L 140,120 Z" class="bar"/>
            <text id="day_1" x="120" y="142" class="day">Fri</text>
            <path id="bar_2" d="M 172,120 L 172,107 Q 172,102 177,102 L 207,102 Q 212,102 212,107 L 212,120 Z" class="bar"/>
            <text id="day_2" x="192" y="142" class="day">Sat</text>
            <path id="bar_3" d="M 244,120 L 244,75 Q 244,70 249,70 L 279,70 Q 284,70 284,75 L 284,120 Z" class="bar"/>
            <text id="day_3" x="264" y="142" class="day">Sun</text>
            <path id="bar_4" d="M 316,120 L 316,59 Q 316,54 321,54 L 351,54 Q 356,54 356,59 L 356,120 Z" class="bar"/>
            <text id="day_4" x="336" y="142" class="day">Mon</text>
            <path id="bar_5" d="M 388,120 L 388,25 Q 388,20 393,20 L 423,20 Q 428,20 428,25 L 428,120 Z" class="bar"/>
            <text id="day_5" x="408" y="142" class="day">Tue</text>
            <path id="bar_6" d="M 460,120 L 460,117 Q 460,112 465,112 L 495,112 Q 500,112 500,117 L 500,120 Z" class="bar-active"/>
            <text id="day_6" x="480" y="142" class="day">Wed</text>
        </g>
    </g>

    <!-- Code stats -->
    <g transform="translate(588, 254)">
        <rect width="356" height="210" rx="12" fill="#FFFFFF" stroke="#E1E4ED" filter="url(#softShadow)"/>
        <text x="22" y="32" class="lbl">LINES OF CODE</text>
        <text x="22" y="66" id="loc_data" font-size="28" font-weight="800" class="t">7,931,395</text>
        <text x="22" y="90" font-size="12" font-weight="700"><tspan id="loc_add" class="gr">++ 9,277,468</tspan><tspan dx="14" id="loc_del" class="rd">-- 1,346,073</tspan></text>
        <line x1="22" y1="106" x2="334" y2="106" stroke="#E1E4ED"/>
        <text x="22" y="128" class="lbl">COMMITS</text>
        <text x="182" y="128" class="lbl">FOLLOWERS</text>
        <text x="22" y="152" id="commit_data" class="num">3,972</text>
        <text x="182" y="152" id="follower_data" class="num">13</text>
        <g transform="translate(22, 172)">
            <rect width="66" height="22" rx="11" fill="#F4F5F9" stroke="#E1E4ED"/><text x="33" y="15" class="chip">Flutter</text>
            <rect x="72" width="56" height="22" rx="11" fill="#F4F5F9" stroke="#E1E4ED"/><text x="100" y="15" class="chip">React</text>
            <rect x="134" width="70" height="22" rx="11" fill="#F4F5F9" stroke="#E1E4ED"/><text x="169" y="15" class="chip">Node.js</text>
            <rect x="210" width="62" height="22" rx="11" fill="#F4F5F9" stroke="#E1E4ED"/><text x="241" y="15" class="chip">Docker</text>
        </g>
    </g>
</svg>