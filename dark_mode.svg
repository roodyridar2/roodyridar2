<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');

            .d-title { font: 700 22px 'Inter', sans-serif; fill: #F8FAFC; }
            .d-subtitle { font: 500 13px 'Inter', sans-serif; fill: #94A3B8; }
            .d-handle { font: 600 13px 'Inter', sans-serif; fill: #818CF8; }
            .d-label { font: 600 11px 'Inter', sans-serif; fill: #64748B; text-transform: uppercase; letter-spacing: 0.8px; }
            .d-body { font: 400 13px 'Inter', sans-serif; fill: #CBD5E1; }
            .d-day-label { font: 500 10px 'Inter', sans-serif; fill: #64748B; text-anchor: middle; }
            
            .d-val-num { font: 700 28px 'JetBrains Mono', monospace; fill: #F1F5F9; }
            .d-val-accent { font: 700 28px 'JetBrains Mono', monospace; fill: #818CF8; }
            .d-val-green { font: 700 28px 'JetBrains Mono', monospace; fill: #34D399; }
            .d-val-purple { font: 700 28px 'JetBrains Mono', monospace; fill: #A78BFA; }

            .d-chip { fill: #1E293B; stroke: #334155; stroke-width: 1; }
            .d-chip-accent { fill: rgba(99, 102, 241, 0.12); stroke: #6366F1; stroke-width: 1; }
            .d-chip-text { font: 500 11px 'Inter', sans-serif; fill: #CBD5E1; }
            .d-chip-accent-text { font: 600 11px 'Inter', sans-serif; fill: #A5B4FC; }

            .d-card { fill: #0F172A; stroke: #1E293B; stroke-width: 1; }
            .d-bar { fill: #6366F1; rx: 4; }
            .d-bar-active { fill: #34D399; rx: 4; }

            .d-add { font: 700 13px 'JetBrains Mono', monospace; fill: #34D399; }
            .d-del { font: 700 13px 'JetBrains Mono', monospace; fill: #F87171; }
            .d-mono { font: 600 13px 'JetBrains Mono', monospace; fill: #E2E8F0; }
        </style>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="520" rx="16" fill="#0B0F17"/>
    <rect x="1" y="1" width="958" height="518" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- ================= HEADER SECTION ================= -->
    <g transform="translate(24, 20)">
        <rect width="912" height="96" rx="12" class="d-card"/>
        
        <!-- Avatar Circle -->
        <circle cx="52" cy="48" r="26" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text x="40" y="55" font-family="'Inter', sans-serif" font-weight="700" font-size="16" fill="#818CF8">AM</text>

        <!-- User Information -->
        <text x="94" y="42" class="d-title">Ayub Mahmood</text>
        <text x="264" y="40" class="d-handle">@roodyridar2</text>
        <text x="94" y="64" class="d-subtitle">Software Engineer @ Otee • Erbil, Kurdistan</text>
    </g>

    <!-- ================= METRICS GRID (4 COLUMNS) ================= -->
    <!-- 1. Repositories -->
    <g transform="translate(24, 130)">
        <rect width="216" height="88" rx="12" class="d-card"/>
        <text x="20" y="30" class="d-label">Repositories</text>
        <text x="20" y="66" id="repo_data" class="d-val-num">20</text>
    </g>

    <!-- 2. Contributions -->
    <g transform="translate(256, 130)">
        <rect width="216" height="88" rx="12" class="d-card"/>
        <text x="20" y="30" class="d-label">Contributions</text>
        <text x="20" y="66" id="contrib_data" class="d-val-accent">20</text>
    </g>

    <!-- 3. Current Streak -->
    <g transform="translate(488, 130)">
        <rect width="216" height="88" rx="12" class="d-card"/>
        <text x="20" y="30" class="d-label">Current Streak</text>
        <text x="20" y="66" id="streak_data" class="d-val-green">7</text>
        <text x="70" y="64" class="d-body" font-size="12">days ⚡</text>
    </g>

    <!-- 4. Regional Rank -->
    <g transform="translate(720, 130)">
        <rect width="216" height="88" rx="12" class="d-card"/>
        <text x="20" y="30" class="d-label">Regional Rank</text>
        <text x="20" y="66" id="rank_data" class="d-val-purple">#31</text>
        <text x="90" y="64" class="d-body" font-size="12">Kurdistan</text>
    </g>

    <!-- ================= MIDDLE SECTION (STACK & GRAPH) ================= -->
    
    <!-- LEFT: Tech Stack Section -->
    <g transform="translate(24, 232)">
        <rect width="448" height="180" rx="12" class="d-card"/>
        
        <text x="20" y="30" class="d-label">Tech Stack &amp; Core Skills</text>

        <!-- Category 1: Frontend & Mobile -->
        <g transform="translate(20, 44)">
            <text x="0" y="14" class="d-subtitle" font-size="11" font-weight="600">Frontend &amp; Mobile</text>
            <rect y="22" width="56" height="24" rx="6" class="d-chip-accent"/>
            <text x="10" y="38" class="d-chip-accent-text">Flutter</text>

            <rect x="62" y="22" width="50" height="24" rx="6" class="d-chip"/>
            <text x="72" y="38" class="d-chip-text">React</text>

            <rect x="118" y="22" width="76" height="24" rx="6" class="d-chip"/>
            <text x="128" y="38" class="d-chip-text">TypeScript</text>

            <rect x="200" y="22" width="56" height="24" rx="6" class="d-chip"/>
            <text x="210" y="38" class="d-chip-text">Next.js</text>
        </g>

        <!-- Category 2: Backend & Database -->
        <g transform="translate(20, 108)">
            <text x="0" y="14" class="d-subtitle" font-size="11" font-weight="600">Backend &amp; Database</text>
            <rect y="22" width="58" height="24" rx="6" class="d-chip"/>
            <text x="10" y="38" class="d-chip-text">Node.js</text>

            <rect x="64" y="22" width="52" height="24" rx="6" class="d-chip"/>
            <text x="74" y="38" class="d-chip-text">Docker</text>

            <rect x="122" y="22" width="74" height="24" rx="6" class="d-chip"/>
            <text x="132" y="38" class="d-chip-text">PostgreSQL</text>

            <rect x="202" y="22" width="52" height="24" rx="6" class="d-chip"/>
            <text x="212" y="38" class="d-chip-text">Python</text>

            <rect x="260" y="22" width="40" height="24" rx="6" class="d-chip"/>
            <text x="270" y="38" class="d-chip-text">SQL</text>
        </g>
    </g>

    <!-- RIGHT: Activity Graph Bar Chart -->
    <g transform="translate(488, 232)">
        <rect width="448" height="180" rx="12" class="d-card"/>
        
        <text x="20" y="30" class="d-label">Weekly Activity Graph</text>

        <!-- Dynamic Activity Bars Container -->
        <g transform="translate(24, 36)">
            <!-- Grid Lines -->
            <line x1="0" y1="35" x2="400" y2="35" stroke="#1E293B" stroke-dasharray="4,4"/>
            <line x1="0" y1="70" x2="400" y2="70" stroke="#1E293B" stroke-dasharray="4,4"/>
            <line x1="0" y1="105" x2="400" y2="105" stroke="#1E293B"/>

            <!-- Bar 0 (Mon) -->
            <rect id="bar_0" x="20" y="90" width="28" height="15" class="d-bar"/>
            <text x="34" y="120" class="d-day-label">Mon</text>

            <!-- Bar 1 (Tue) -->
            <rect id="bar_1" x="75" y="75" width="28" height="30" class="d-bar"/>
            <text x="89" y="120" class="d-day-label">Tue</text>

            <!-- Bar 2 (Wed) -->
            <rect id="bar_2" x="130" y="49" width="28" height="56" class="d-bar-active"/>
            <text x="144" y="120" class="d-day-label">Wed</text>

            <!-- Bar 3 (Thu) -->
            <rect id="bar_3" x="185" y="60" width="28" height="45" class="d-bar"/>
            <text x="199" y="120" class="d-day-label">Thu</text>

            <!-- Bar 4 (Fri) -->
            <rect id="bar_4" x="240" y="30" width="28" height="75" class="d-bar"/>
            <text x="254" y="120" class="d-day-label">Fri</text>

            <!-- Bar 5 (Sat) -->
            <rect id="bar_5" x="295" y="68" width="28" height="37" class="d-bar"/>
            <text x="309" y="120" class="d-day-label">Sat</text>

            <!-- Bar 6 (Sun) -->
            <rect id="bar_6" x="350" y="38" width="28" height="67" class="d-bar"/>
            <text x="364" y="120" class="d-day-label">Sun</text>
        </g>
    </g>

    <!-- ================= BOTTOM OVERVIEW BAR ================= -->
    <g transform="translate(24, 424)">
        <rect width="912" height="76" rx="12" class="d-card"/>
        
        <!-- Lines of Code & Links -->
        <g transform="translate(20, 24)">
            <text x="0" y="14" class="d-label">Lines of Code</text>
            <text x="110" y="15" id="loc_data" class="d-mono">0</text>

            <text x="200" y="15" id="loc_add" class="d-add">++ 0</text>
            <text x="300" y="15" id="loc_del" class="d-del">-- 0</text>
        </g>

        <g transform="translate(20, 50)">
            <text x="0" y="14" class="d-subtitle">Total Commits:</text>
            <text x="100" y="14" id="commit_data" class="d-mono">Commits: 502</text>

            <text x="250" y="14" class="d-subtitle">Followers:</text>
            <text x="320" y="14" id="follower_data" class="d-mono">10</text>

            <text x="400" y="14" class="d-subtitle">Portfolio:</text>
            <text x="470" y="14" class="d-mono" fill="#818CF8">https://ayub.is-a.dev/</text>
        </g>
    </g>

    <!-- Hidden elements for today.py compatibility -->
    <text id="age_data" display="none">23 years, 6 months, 19 days</text>
    <text id="age_data_dots" display="none"> . </text>
    <text id="commit_data_dots" display="none"> . </text>
    <text id="rank_data_dots" display="none"> . </text>
    <text id="repo_data_dots" display="none"> . </text>
    <text id="follower_data_dots" display="none"> . </text>
    <text id="loc_data_dots" display="none"> . </text>
    <text id="streak_data_dots" display="none"> . </text>
</svg>