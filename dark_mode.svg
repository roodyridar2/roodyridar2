<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');

            * { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }

            .c-bg { fill: #11111B; }
            .c-txt-main { fill: #CDD6F4; }
            .c-txt-sub { fill: #A6ADC8; }
            .c-txt-muted { fill: #6C7086; }
            .c-txt-mauve { fill: #CBA6F7; }
            .c-txt-blue { fill: #89B4FA; }
            .c-txt-green { fill: #A6E3A1; }
            .c-txt-peach { fill: #FAB387; }
            .c-txt-red { fill: #F38BA8; }
            .c-txt-yellow { fill: #F9E2AF; }
            .c-txt-teal { fill: #94E2D5; }

            .d-val-num { font: 700 24px 'JetBrains Mono', monospace; fill: #CDD6F4; }
            .d-val-accent { font: 700 24px 'JetBrains Mono', monospace; fill: #89B4FA; }
            .d-val-green { font: 700 24px 'JetBrains Mono', monospace; fill: #A6E3A1; }
            .d-val-purple { font: 700 24px 'JetBrains Mono', monospace; fill: #CBA6F7; }

            .d-label { font: 700 10px 'JetBrains Mono', monospace; fill: #6C7086; letter-spacing: 0.6px; }
            .d-body { font: 500 12px 'JetBrains Mono', monospace; fill: #A6ADC8; }
            .d-day-label { font: 600 10px 'JetBrains Mono', monospace; fill: #6C7086; text-anchor: middle; }

            .d-bar { fill: #89B4FA; rx: 4; }
            .d-bar-active { fill: #A6E3A1; rx: 4; }

            .d-add { font: 700 12px 'JetBrains Mono', monospace; fill: #A6E3A1; }
            .d-del { font: 700 12px 'JetBrains Mono', monospace; fill: #F38BA8; }
            .d-mono { font: 600 12px 'JetBrains Mono', monospace; fill: #CDD6F4; }
        </style>

        <linearGradient id="hyprBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#CBA6F7"/>
            <stop offset="100%" stop-color="#89B4FA"/>
        </linearGradient>
        
        <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#89B4FA"/>
            <stop offset="100%" stop-color="#CBA6F7"/>
        </linearGradient>
    </defs>

    <!-- Canvas Background -->
    <rect width="960" height="540" rx="16" class="c-bg"/>
    <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#313244" stroke-width="1.5"/>

    <!-- ================= TOP STATUS BAR (WAYBAR) ================= -->
    <!-- Left Module: Workspaces -->
    <g transform="translate(14, 12)">
        <rect width="240" height="30" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
        <rect x="4" y="4" width="52" height="22" rx="4" fill="#CBA6F7"/>
        <text x="30" y="19" font-size="11" font-weight="700" fill="#11111B" text-anchor="middle">1:dev</text>
        <text x="84" y="19" font-size="11" font-weight="600" class="c-txt-muted" text-anchor="middle">2:term</text>
        <text x="136" y="19" font-size="11" font-weight="600" class="c-txt-muted" text-anchor="middle">3:git</text>
        <text x="188" y="19" font-size="11" font-weight="600" class="c-txt-muted" text-anchor="middle">4:sys</text>
    </g>

    <!-- Center Module: Host & Distro -->
    <g transform="translate(268, 12)">
        <rect width="396" height="30" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
        <text x="198" y="19" font-size="11" font-weight="600" class="c-txt-main" text-anchor="middle">
            <tspan fill="#89B4FA">λ</tspan> archlinux <tspan fill="#6C7086">•</tspan> roody@arch:~ <tspan fill="#CBA6F7">(hyprland)</tspan>
        </text>
    </g>

    <!-- Right Module: Rank & System Pill -->
    <g transform="translate(678, 12)">
        <rect width="268" height="30" rx="6" fill="#181825" stroke="#313244" stroke-width="1"/>
        <text x="16" y="19" font-size="11" font-weight="700" fill="#F9E2AF">★ #26 Kurdistan</text>
        <text x="142" y="19" font-size="11" font-weight="600" class="c-txt-muted">|</text>
        <text x="158" y="19" font-size="11" font-weight="700" fill="#A6E3A1">⚡ 8d</text>
        <circle cx="218" cy="15" r="4" fill="#A6E3A1"/>
        <text x="228" y="19" font-size="11" font-weight="600" fill="#A6E3A1">idle</text>
    </g>

    <!-- ================= MAIN DESKTOP AREA ================= -->

    <!-- LEFT WINDOW: TERMINAL (fastfetch & stack.json) -->
    <g transform="translate(14, 52)">
        <!-- Active Hyprland Border -->
        <rect width="458" height="474" rx="10" fill="#181825" stroke="url(#hyprBorder)" stroke-width="1.5"/>
        
        <!-- Window Titlebar -->
        <path d="M 0,10 Q 0,0 10,0 L 448,0 Q 458,0 458,10 L 458,30 L 0,30 Z" fill="#11111B"/>
        <line x1="0" y1="30" x2="458" y2="30" stroke="#313244" stroke-width="1"/>
        
        <!-- Controls -->
        <circle cx="16" cy="15" r="4.5" fill="#F38BA8"/>
        <circle cx="30" cy="15" r="4.5" fill="#F9E2AF"/>
        <circle cx="44" cy="15" r="4.5" fill="#A6E3A1"/>
        <text x="60" y="19" font-size="11" font-weight="600" class="c-txt-sub">kitty ~ roody@arch: ~/profile</text>
        <rect x="396" y="6" width="50" height="18" rx="3" fill="rgba(166, 227, 161, 0.15)"/>
        <text x="421" y="19" font-size="9" font-weight="700" fill="#A6E3A1" text-anchor="middle">active</text>

        <!-- Command 1: fastfetch -->
        <text x="16" y="54" font-size="12" font-weight="700" fill="#CDD6F4">
            <tspan fill="#A6E3A1">roody@arch</tspan><tspan fill="#6C7086">:</tspan><tspan fill="#89B4FA">~</tspan><tspan fill="#CBA6F7">$</tspan> fastfetch
        </text>

        <!-- Vector Arch Logo -->
        <g transform="translate(16, 70)">
            <path d="M 40,8 L 10,76 C 21,70 30,66 40,66 C 35,55 33,43 35,33 C 38,41 42,50 49,58 C 55,57 61,58 69,61 L 40,8 Z M 40,72 C 34,72 26,75 16,79 C 27,82 36,84 44,84 C 51,84 58,82 67,78 C 58,74 49,72 40,72 Z" fill="url(#archGrad)"/>
        </g>

        <!-- Fastfetch Info Lines -->
        <g transform="translate(112, 74)">
            <text x="0" y="12" font-size="13" font-weight="700" fill="#CBA6F7">roody@archlinux</text>
            <line x1="0" y1="19" x2="326" y2="19" stroke="#313244" stroke-width="1"/>

            <text x="0" y="36" font-size="11" font-weight="600" class="c-txt-peach">user     <tspan class="c-txt-main" font-weight="500">Ayub Mahmood</tspan></text>
            <text x="0" y="54" font-size="11" font-weight="600" class="c-txt-yellow">role     <tspan class="c-txt-main" font-weight="500">Software Engineer @ Otee</tspan></text>
            <text x="0" y="72" font-size="11" font-weight="600" class="c-txt-teal">loc      <tspan class="c-txt-main" font-weight="500">Erbil, Kurdistan</tspan></text>
            <text x="0" y="90" font-size="11" font-weight="600" class="c-txt-blue">wm       <tspan class="c-txt-main" font-weight="500">Hyprland (Wayland)</tspan></text>
            <text x="0" y="108" font-size="11" font-weight="600" class="c-txt-mauve">shell    <tspan class="c-txt-main" font-weight="500">zsh 5.9 (kitty)</tspan></text>
            <text x="0" y="126" font-size="11" font-weight="600" class="c-txt-green">uptime   <tspan id="age_data" class="c-txt-green" font-weight="600">23 years, 7 months, 22 days</tspan></text>

            <!-- Color Palette Row -->
            <g transform="translate(0, 138)">
                <rect x="0" width="18" height="9" rx="2" fill="#F38BA8"/>
                <rect x="22" width="18" height="9" rx="2" fill="#FAB387"/>
                <rect x="44" width="18" height="9" rx="2" fill="#F9E2AF"/>
                <rect x="66" width="18" height="9" rx="2" fill="#A6E3A1"/>
                <rect x="88" width="18" height="9" rx="2" fill="#94E2D5"/>
                <rect x="110" width="18" height="9" rx="2" fill="#89B4FA"/>
                <rect x="132" width="18" height="9" rx="2" fill="#CBA6F7"/>
                <rect x="154" width="18" height="9" rx="2" fill="#CDD6F4"/>
            </g>
        </g>

        <!-- Command 2: cat ~/.config/skills.json -->
        <line x1="16" y1="242" x2="442" y2="242" stroke="#313244" stroke-dasharray="3,3"/>
        <text x="16" y="264" font-size="12" font-weight="700" fill="#CDD6F4">
            <tspan fill="#A6E3A1">roody@arch</tspan><tspan fill="#6C7086">:</tspan><tspan fill="#89B4FA">~</tspan><tspan fill="#CBA6F7">$</tspan> cat ~/.config/stack.json
        </text>

        <!-- JSON Code Preview Card -->
        <g transform="translate(16, 276)">
            <rect width="426" height="154" rx="6" fill="#11111B" stroke="#313244" stroke-width="1"/>
            <text x="16" y="24" font-size="11" class="c-txt-muted">{</text>
            
            <text x="28" y="44" font-size="11" class="c-txt-blue">"frontend"<tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-green">"Flutter"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"React"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"TypeScript"</tspan><tspan class="c-txt-muted">],</tspan></text>
            
            <text x="28" y="66" font-size="11" class="c-txt-blue">"backend" <tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-green">"Node.js"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"Docker"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"PostgreSQL"</tspan><tspan class="c-txt-muted">],</tspan></text>
            
            <text x="28" y="88" font-size="11" class="c-txt-blue">"languages"<tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-green">"Python"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"Dart"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"SQL"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-green">"Bash"</tspan><tspan class="c-txt-muted">],</tspan></text>
            
            <text x="28" y="110" font-size="11" class="c-txt-blue">"ricing"   <tspan class="c-txt-muted">: [</tspan><tspan class="c-txt-peach">"Hyprland"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-peach">"Waybar"</tspan><tspan class="c-txt-muted">, </tspan><tspan class="c-txt-peach">"Catppuccin"</tspan><tspan class="c-txt-muted">]</tspan></text>
            
            <text x="16" y="132" font-size="11" class="c-txt-muted">}</text>
        </g>

        <!-- Neovim Style Statusline -->
        <g transform="translate(0, 446)">
            <path d="M 0,0 L 458,0 L 458,18 Q 458,28 448,28 L 10,28 Q 0,28 0,18 Z" fill="#11111B"/>
            <rect x="8" y="5" width="62" height="18" rx="3" fill="#CBA6F7"/>
            <text x="39" y="18" font-size="9" font-weight="800" fill="#11111B" text-anchor="middle">NORMAL</text>
            <text x="80" y="18" font-size="10" font-weight="600" class="c-txt-main">stack.json</text>
            <text x="380" y="18" font-size="10" font-weight="600" class="c-txt-muted">utf-8 | 100%</text>
        </g>
    </g>

    <!-- ================= RIGHT COLUMN ================= -->

    <!-- TOP RIGHT: GIT STATS RADAR -->
    <g transform="translate(486, 52)">
        <rect width="460" height="224" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
        
        <!-- Header / Titlebar -->
        <path d="M 0,10 Q 0,0 10,0 L 450,0 Q 460,0 460,10 L 460,30 L 0,30 Z" fill="#11111B"/>
        <line x1="0" y1="30" x2="460" y2="30" stroke="#313244" stroke-width="1"/>
        <circle cx="16" cy="15" r="4.5" fill="#F38BA8"/>
        <circle cx="30" cy="15" r="4.5" fill="#F9E2AF"/>
        <circle cx="44" cy="15" r="4.5" fill="#A6E3A1"/>
        <text x="60" y="19" font-size="11" font-weight="600" class="c-txt-sub">git-radar ~ metrics</text>
        <rect x="396" y="6" width="50" height="18" rx="3" fill="rgba(137, 180, 250, 0.15)"/>
        <text x="421" y="19" font-size="9" font-weight="700" fill="#89B4FA" text-anchor="middle">master</text>

        <!-- 2x2 Metric Grid -->
        <!-- Card 1: Streak -->
        <g transform="translate(16, 42)">
            <rect width="206" height="78" rx="6" fill="#1E1E2E" stroke="#313244" stroke-width="1"/>
            <text x="20" y="24" class="d-label">CURRENT STREAK</text>
            <text x="20" y="60" id="streak_data" class="d-val-green">8</text>
            <text x="45" y="58" id="streak_unit" class="d-body">days ⚡</text>
        </g>

        <!-- Card 2: Rank -->
        <g transform="translate(238, 42)">
            <rect width="206" height="78" rx="6" fill="#1E1E2E" stroke="#313244" stroke-width="1"/>
            <text x="20" y="24" class="d-label">REGIONAL RANK</text>
            <text x="20" y="60" id="rank_data" class="d-val-purple">#26</text>
            <text x="80" y="58" class="d-body">Kurdistan</text>
        </g>

        <!-- Card 3: Repositories -->
        <g transform="translate(16, 132)">
            <rect width="206" height="78" rx="6" fill="#1E1E2E" stroke="#313244" stroke-width="1"/>
            <text x="20" y="24" class="d-label">REPOSITORIES</text>
            <text x="20" y="60" id="repo_data" class="d-val-num">73</text>
            <text x="75" y="58" class="d-body">public</text>
        </g>

        <!-- Card 4: Contributions -->
        <g transform="translate(238, 132)">
            <rect width="206" height="78" rx="6" fill="#1E1E2E" stroke="#313244" stroke-width="1"/>
            <text x="20" y="24" class="d-label">CONTRIBUTIONS</text>
            <text x="20" y="60" id="contrib_data" class="d-val-accent">3,674</text>
            <text x="115" y="58" class="d-body">total</text>
        </g>
    </g>

    <!-- BOTTOM RIGHT: ACTIVITY GRAPH & LOC (btop style) -->
    <g transform="translate(486, 290)">
        <rect width="460" height="236" rx="10" fill="#181825" stroke="#313244" stroke-width="1"/>
        
        <!-- Header / Titlebar -->
        <path d="M 0,10 Q 0,0 10,0 L 450,0 Q 460,0 460,10 L 460,30 L 0,30 Z" fill="#11111B"/>
        <line x1="0" y1="30" x2="460" y2="30" stroke="#313244" stroke-width="1"/>
        <circle cx="16" cy="15" r="4.5" fill="#F38BA8"/>
        <circle cx="30" cy="15" r="4.5" fill="#F9E2AF"/>
        <circle cx="44" cy="15" r="4.5" fill="#A6E3A1"/>
        <text x="60" y="19" font-size="11" font-weight="600" class="c-txt-sub">btop v1.3.2 ~ git activity</text>
        <rect x="396" y="6" width="50" height="18" rx="3" fill="rgba(166, 227, 161, 0.15)"/>
        <text x="421" y="19" font-size="9" font-weight="700" fill="#A6E3A1" text-anchor="middle">running</text>

        <!-- Dynamic Activity Bars Container -->
        <g transform="translate(32, 24)">
            <!-- Grid Lines -->
            <line x1="0" y1="35" x2="400" y2="35" stroke="#313244" stroke-dasharray="4,4"/>
            <line x1="0" y1="70" x2="400" y2="70" stroke="#313244" stroke-dasharray="4,4"/>
            <line x1="0" y1="105" x2="400" y2="105" stroke="#313244"/>

            <!-- Bar 0 (Mon) -->
            <path id="bar_0" d="M 20,105 L 20,35 Q 20,30 25,30 L 43,30 Q 48,30 48,35 L 48,105 Z" class="d-bar"/>
            <text x="34" y="120" class="d-day-label">Mon</text>

            <!-- Bar 1 (Tue) -->
            <path id="bar_1" d="M 75,105 L 75,104 Q 75,99 80,99 L 98,99 Q 103,99 103,104 L 103,105 Z" class="d-bar"/>
            <text x="89" y="120" class="d-day-label">Tue</text>

            <!-- Bar 2 (Wed) -->
            <path id="bar_2" d="M 130,105 L 130,104 Q 130,99 135,99 L 153,99 Q 158,99 158,104 L 158,105 Z" class="d-bar-active"/>
            <text x="144" y="120" class="d-day-label">Wed</text>

            <!-- Bar 3 (Thu) -->
            <path id="bar_3" d="M 185,105 L 185,104 Q 185,99 190,99 L 208,99 Q 213,99 213,104 L 213,105 Z" class="d-bar"/>
            <text x="199" y="120" class="d-day-label">Thu</text>

            <!-- Bar 4 (Fri) -->
            <path id="bar_4" d="M 240,105 L 240,90 Q 240,85 245,85 L 263,85 Q 268,85 268,90 L 268,105 Z" class="d-bar"/>
            <text x="254" y="120" class="d-day-label">Fri</text>

            <!-- Bar 5 (Sat) -->
            <path id="bar_5" d="M 295,105 L 295,104 Q 295,99 300,99 L 318,99 Q 323,99 323,104 L 323,105 Z" class="d-bar"/>
            <text x="309" y="120" class="d-day-label">Sat</text>

            <!-- Bar 6 (Sun) -->
            <path id="bar_6" d="M 350,105 L 350,104 Q 350,99 355,99 L 373,99 Q 378,99 378,104 L 378,105 Z" class="d-bar"/>
            <text x="364" y="120" class="d-day-label">Sun</text>
        </g>

        <!-- Divider & Terminal Metrics Footer -->
        <line x1="16" y1="164" x2="444" y2="164" stroke="#313244" stroke-width="1"/>

        <g transform="translate(16, 174)">
            <text x="0" y="14" font-size="11" class="c-txt-muted">
                Lines of Code: <tspan id="loc_data" class="d-mono">7,543,886</tspan>  <tspan id="loc_add" class="d-add">++ 8,684,111</tspan>  <tspan id="loc_del" class="d-del">-- 1,140,225</tspan>
            </text>
            <text x="0" y="38" font-size="11" class="c-txt-muted">
                Commits: <tspan id="commit_data" class="d-mono">3,624</tspan>  •  Followers: <tspan id="follower_data" class="d-mono">10</tspan>  •  <tspan fill="#89B4FA">ayub.is-a.dev</tspan>
            </text>
        </g>
    </g>

    <!-- Hidden compatibility elements for today.py -->
    <text id="age_data_dots" display="none"> . </text>
    <text id="commit_data_dots" display="none"> . </text>
    <text id="rank_data_dots" display="none"> . </text>
    <text id="repo_data_dots" display="none"> . </text>
    <text id="follower_data_dots" display="none"> . </text>
    <text id="loc_data_dots" display="none"> . </text>
    <text id="streak_data_dots" display="none"> . </text>
</svg>